services:
  - type: web
    name: bis-physicians-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: MCP_AUTH_PASSWORD
        sync: false
      - key: MCP_OAUTH_SIGNING_KEY
        generateValue: true
      - key: MCP_BEARER_TOKEN
        generateValue: true
