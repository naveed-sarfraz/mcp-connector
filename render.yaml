services:
  - type: web
    name: insightmonk-reports-mcp
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: INSIGHTMONK_BASE_URL
        value: https://community-api.insightmonk.com
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: PDF_MAX_DOWNLOAD_BYTES
        value: "52428800"
      - key: PDF_MAX_EMBEDDED_BYTES
        value: "20971520"
      - key: LOG_LEVEL
        value: INFO
